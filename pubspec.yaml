name: tagebuch_workspace
description: Workspace des lokalen Sprach-Tagebuchs (Arbeitstitel Abendton). Keine Cloud, keine Konten.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/diary_core
  - packages/diary_crypto
  - packages/diary_chunkfile
  - packages/diary_container
  - packages/diary_storage
  - packages/diary_audio
  - packages/diary_stt
  - packages/diary_keys
  - packages/diary_reminders
  - packages/diary_web

# Native SQLite für package:sqlite3 (drift). Der Hook von sqlite3 3.5.x erwartet hier einen
# einzelnen Wert (sqlite3 | sqlite3mc | sqlcipher | system | process | executable).
# Entwicklung und Tests laufen auf Linux gegen die Systembibliothek. Spike S4 stellt für die
# Zielplattformen auf `sqlcipher` um (D4, docs/04 Abschnitt 5.1); bis dahin nutzt die App
# diary_storage noch nicht.
hooks:
  user_defines:
    sqlite3:
      source: system
