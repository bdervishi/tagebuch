name: tagebuch_workspace
description: Workspace des lokalen Sprach-Tagebuchs (Arbeitstitel Abendton). Keine Cloud, keine Konten.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/diary_core
  - packages/diary_crypto
  - packages/diary_chunkfile
  - packages/diary_container
  - packages/diary_storage
  - packages/diary_audio
  - packages/diary_stt
  - packages/diary_keys
  - packages/diary_reminders

# Native SQLite für package:sqlite3 (drift). Für Entwicklung und Tests auf Linux die
# Systembibliothek; für die Zielplattformen vorerst die von package:sqlite3 gelieferten
# Binaries. Spike S4 stellt die Zielplattformen auf `sqlcipher` um (D4, docs/04 Abschnitt 5.1).
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3
