name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyse-und-tests:
    name: Analyse, Tests, Netz-Wächter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Systembibliotheken für Tests (SQLite)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Abhängigkeiten
        run: flutter pub get
      - name: Formatierung
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyse
        run: flutter analyze --no-fatal-infos
      - name: Netz-Wächter
        run: tool/check_no_network.sh
      - name: Tests der reinen Dart-Pakete
        run: |
          for p in diary_core diary_crypto diary_chunkfile diary_container diary_storage; do
            echo "== $p"; (cd packages/$p && dart test --reporter expanded)
          done
      - name: Tests der Flutter-Pakete
        run: |
          for p in diary_audio diary_stt diary_keys diary_reminders; do
            echo "== $p"; (cd packages/$p && flutter test)
          done
      - name: Tests der Web-Umsetzungen im Chromium
        run: cd packages/diary_web && flutter test --platform chrome
      - name: Tests der App
        run: cd app && flutter test

  android-build:
    name: Android-Build (Release, unsigniert) und gemergtes Manifest prüfen
    runs-on: ubuntu-latest
    needs: analyse-und-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: APK bauen
        run: cd app && flutter build apk --release
      - name: Netz-Wächter gegen gemergtes Manifest
        run: tool/check_no_network.sh
      - name: Berechtigungen des APK auflisten (Protokoll)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions app/build/app/outputs/flutter-apk/app-release.apk
          if "$AAPT" dump permissions app/build/app/outputs/flutter-apk/app-release.apk | grep -q INTERNET; then
            echo "FEHLER: APK fordert INTERNET an"; exit 1; fi
