<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    Lokales Sprach-Tagebuch als installierbare Web-App (D16).
    Die Content-Security-Policy beschränkt alle Verbindungen auf den eigenen Origin:
    Die App lädt nach dem ersten Start nur noch eigene Dateien und spricht mit keinem Server.
    'wasm-unsafe-eval' braucht die Flutter-Engine (CanvasKit); 'unsafe-inline' für Stile setzt der Flutter-Loader.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'">
  <!-- interactive-widget=resizes-content: Die Tastatur verkleinert die Ansicht (Android), statt Inhalte zu verdecken. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Sprich deinen Tag. Er bleibt auf deinem Handy. Keine Cloud, keine Konten.">
  <!-- Statusleiste in der Farbe des oberen Seitenrands (Material-3-Fläche des Themas), je Farbschema. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF8F5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#19120D">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">

  <!-- iOS: als App zum Home-Bildschirm -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tagebuch">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Tagebuch</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Grundlage "fühlt sich installiert an" (docs/12-gestaltung.md, Abschnitt Web):
       kein grauer Tipp-Blitz, kein Ziehen-zum-Aktualisieren, keine Schriftvergrößerung im Querformat,
       Hintergrund in der Flächenfarbe des Themas, damit vor dem ersten Frame nichts blitzt. */
    html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
    html, body { height: 100%; margin: 0; background: #FFF8F5; }
    @media (prefers-color-scheme: dark) { html, body { background: #19120D; } }
    #lade { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
            font-family: system-ui, sans-serif; color: #8B5024; font-size: 1rem; letter-spacing: 0.01em;
            animation: lade-ein 400ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    #lade .punkt { width: 44px; height: 44px; border-radius: 50%; background: #8B5024; opacity: 0.9; }
    @media (prefers-color-scheme: dark) { #lade { color: #FFB787; } #lade .punkt { background: #FFB787; } }
    @keyframes lade-ein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    #lade { transition: opacity 200ms ease; }
    #lade.weg { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { #lade { animation: none; } }
    noscript { display: block; padding: 2rem; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="lade" aria-live="polite"><div class="punkt" aria-hidden="true"></div>Tagebuch wird geladen …</div>
  <noscript>Das Tagebuch braucht JavaScript. Es läuft vollständig auf deinem Gerät.</noscript>
  <script src="flutter_bootstrap.js" async></script>
  <script src="sw_register.js"></script>
</body>
</html>
